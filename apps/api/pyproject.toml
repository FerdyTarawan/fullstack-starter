[project]
name = "api"
version = "0.1.0"
description = "Backend API"
requires-python = ">=3.14"
dependencies = ["fastapi", "granian", "pydantic-settings", "scalar-fastapi"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
