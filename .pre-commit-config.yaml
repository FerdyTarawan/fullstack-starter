repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Python lint (Ruff)
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Python format (Ruff)
        entry: ruff format --check
        language: system
        types: [python]
      - id: ty-check
        name: Python types (ty)
        entry: uv run ty check apps scripts
        language: system
        pass_filenames: false
        files: ^(apps|scripts)/.*\.py$
      - id: web-lint
        name: Frontend lint (Vite+)
        entry: vp lint
        language: system
        files: ^(apps/web/.*\.[cm]?[jt]sx?|vite\.config\.ts)$
        exclude: ^apps/web/src/(routeTree\.gen\.ts|client/.*)$
      - id: web-format
        name: Frontend format (Vite+)
        entry: vp fmt --check
        language: system
        files: ^(apps/web/.*\.(tsx?|jsx?|json|css|md|yaml)|vite\.config\.ts)$
        exclude: ^apps/web/(openapi\.json|src/routeTree\.gen\.ts|src/client/.*)$
