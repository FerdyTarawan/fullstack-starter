[tools]
python = "3.14.9"
node = "26.12.1"
uv = "0.13.5"
pnpm = "12.15.0"
ruff = "0.17.1"
prek = "0.5.7"

[tasks.setup]
description = "Install locked dependencies and Git hooks"
run = ["uv sync --frozen --all-packages", "pnpm install --frozen-lockfile", "prek install"]

[tasks.dev]
description = "Start all dev:* apps; Ctrl-C stops all"
run = "python scripts/dev.py"

[tasks."dev:api"]
run = "uv run --package api granian --interface asgi --reload --reload-paths apps/api/src --host 127.0.0.1 --port 8000 api.main:app"

[tasks."dev:web"]
run = "pnpm --dir apps/web run dev"

[tasks."gen:api"]
description = "Generate TypeScript SDK using @hey-api/openapi-ts"
run = [
  "uv run --package api python scripts/export_openapi.py",
  "pnpm --dir apps/web run openapi-ts",
]

[tasks."ui:add"]
description = "Add shadcn UI components to the web app (e.g., mise run ui:add input)"
run = [
  'pnpm --dir apps/web run ui:add',
  "pnpm --dir apps/web run format src/components/ui",
]

[tasks.check]
description = "Check Python and frontend formatting, lint, and types"
run = [
  "ruff check apps scripts",
  "ruff format --check apps scripts",
  "uv run ty check apps scripts",
  "pnpm --dir apps/web run check",
]

[tasks.format]
run = ["ruff check --fix apps scripts", "ruff format apps scripts", "pnpm --dir apps/web run format"]

[tasks.test]
run = ["uv run pytest apps/api", "pnpm --dir apps/web run test"]

[tasks.build]
run = "pnpm --dir apps/web run build"
