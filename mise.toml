[tools]
python = "3.14.7"
node = "26.7.0"
uv = "0.12.24"
pnpm = "12.6.0"

[tasks.setup]
description = "Install locked dependencies and Git hooks"
run = ["ruff --version", "prek --version", "uv sync --frozen --project apps/api", "pnpm install --frozen-lockfile", "prek install"]

[tasks.dev]
description = "Start both apps; Ctrl-C stops both"
run = "python scripts/dev.py"

[tasks."dev:api"]
run = "uv run --project apps/api granian --interface asgi --reload --reload-paths apps/api/src --host 127.0.0.1 --port 8000 api.main:app"

[tasks."dev:web"]
run = "pnpm --dir apps/web exec vp dev --host 127.0.0.1 --port 3000 --strictPort"

[tasks.check]
description = "Check Python and frontend formatting, lint, and frontend types"
run = ["ruff check apps/api scripts", "ruff format --check apps/api scripts", "pnpm --dir apps/web exec vp check", "pnpm --dir apps/web exec tsc --noEmit"]

[tasks.format]
run = ["ruff check --fix apps/api scripts", "ruff format apps/api scripts", "pnpm --dir apps/web exec vp fmt"]

[tasks.test]
run = ["uv run --directory apps/api pytest", "pnpm --dir apps/web exec vp test run"]

[tasks.build]
run = "pnpm --dir apps/web exec vp build"
